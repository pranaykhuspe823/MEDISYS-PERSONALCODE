<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - IPD Rounds</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn" data-i18n="common.logout">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="navigation.ipd_rounds">IPD Rounds</h1>
    <p class="portal-subtitle" data-i18n="dashboard.card_doc_ipd_hint">Your admitted patients &mdash; write round notes and issue orders.</p>

    <div class="portal-card wizard-step">
      <label for="admissionSelect" data-i18n="opd.currently_in_ward">Admitted Patient</label>
      <select id="admissionSelect"></select>
    </div>

    <div id="workspace" hidden>
      <div class="portal-card">
        <div class="chart-section">
          <h2 class="chart-section-title" data-i18n="records.vitals">Vitals</h2>
          <div id="vitalsFeed"></div>
        </div>

        <div class="chart-section">
          <h2 class="chart-section-title">Notes &amp; Complications</h2>
          <div id="notesFeed"></div>
        </div>

        <div class="chart-section">
          <h2 class="chart-section-title">Write Round Note</h2>
          <label>Dictate in your language</label>
          <div id="voiceDictate"></div>
          <textarea id="roundNote" placeholder="Round observations, admission notes..."></textarea>
          <div class="wizard-nav">
            <button type="button" class="login-btn wizard-next-btn" id="postRoundNoteBtn">Post Note</button>
          </div>
        </div>

        <div class="chart-section">
          <h2 class="chart-section-title" data-i18n="doctor_ipd.issue_order">Issue Order</h2>
          <div class="wizard-grid">
            <div>
              <label for="orderType" data-i18n="appointments.type">Type</label>
              <select id="orderType">
                <option value="test" data-i18n="doctor_ipd.type_test">Test</option>
                <option value="medicine" data-i18n="doctor_ipd.type_medicine">Medicine</option>
                <option value="procedure" data-i18n="doctor_ipd.type_procedure">Procedure</option>
                <option value="nursing_instruction" data-i18n="doctor_ipd.type_nursing_instruction">Nursing Instruction</option>
              </select>
            </div>
          </div>
          <label for="orderDescription" data-i18n="bills.description">Description</label>
          <textarea id="orderDescription"></textarea>
          <div class="wizard-nav">
            <button type="button" class="login-btn wizard-next-btn" id="issueOrderBtn" data-i18n="doctor_ipd.issue_order">Issue Order</button>
          </div>
          <div id="ordersFeed"></div>
        </div>

        <p class="form-error" id="ipdError" role="alert" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
  <script src="../language/voice-widget.js"></script>
<script src="doctor-ipd.js"></script>
</body>
</html>
