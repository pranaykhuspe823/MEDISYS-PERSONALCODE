<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Admission Request</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="ipd_admission.title">Admission Request</h1>
    <p class="portal-subtitle" data-i18n="ipd_admission.subtitle">Initiate a direct IPD admission for a patient.</p>

    <div class="portal-card wizard-step">
      <label for="patientSearch" data-i18n="ipd_admission.search_label">Search patient by name, phone, or UHID</label>
      <input type="text" id="patientSearch" data-i18n-placeholder="ipd_admission.search_placeholder" placeholder="e.g. Ramesh, 98765xxxxx, PAT-CHG-000001" />
      <div id="searchResults" class="staff-roster-grid patient-search-results"></div>
      <p class="wizard-hint" id="selectedPatientHint"></p>
    </div>

    <div class="portal-card">
      <form id="admissionForm" class="wizard-step" novalidate>
        <label for="doctorSelect" data-i18n="ipd_admission.admitting_doctor">Admitting Doctor</label>
        <select id="doctorSelect"></select>

        <label class="module-check" style="margin-top: 16px;">
          <input type="checkbox" id="consentObtained" />
          <span data-i18n="ipd_admission.consent_obtained">Consent form obtained</span>
        </label>

        <label for="idProofNote" data-i18n="ipd_admission.id_proof">ID Proof</label>
        <input type="text" id="idProofNote" data-i18n-placeholder="ipd_admission.id_proof_placeholder" placeholder="e.g. Aadhaar verified, copy on file" />

        <p class="form-error" id="admissionFormError" role="alert" aria-live="polite"></p>

        <div class="wizard-nav">
          <button type="submit" class="login-btn wizard-next-btn" id="submitAdmissionBtn" data-i18n="ipd_admission.submit_request">Submit Admission Request</button>
        </div>
      </form>

      <div id="admissionResult" class="wizard-result" hidden>
        <h2 data-i18n="ipd_admission.created_title">Admission Request Created</h2>
        <p data-i18n="ipd_admission.created_subtitle">This patient is now in the pending list for bed allocation by a nurse/ward admin.</p>
        <a href="dashboard" class="login-btn portal-register-btn wizard-done-btn" data-i18n="registration.back_to_dashboard">Back to Dashboard</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="ipd-admission.js"></script>
</body>
</html>
