<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDISYS - Radiology Queue</title>
<style>
  :root{
    --bg:#EEF2F1;
    --surface:#FFFFFF;
    --surface-2:#F5F7F6;
    --ink:#132420;
    --ink-soft:#4E5E5A;
    --ink-mute:#8B9A96;
    --line:#DCE4E1;
    --teal:#0F6E56;
    --teal-deep:#0A4E3D;
    --teal-tint:#E1F5EE;
    --amber:#B4740E;
    --amber-tint:#FAEEDA;
    --red:#A32D2D;
    --red-tint:#FCEBEB;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ===== Top bar ===== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:var(--teal-deep); color:#fff;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2px;}
  .brand .mark{
    width:30px; height:30px; border-radius:8px; background:#fff; color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:13px;
  }
  .brand .sub{font-weight:400; font-size:12px; opacity:.75; margin-left:8px;}
  .topbar-right{display:flex; align-items:center; gap:16px; font-size:13px;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; text-decoration:none;
    color:#fff; padding:7px 14px; border:1.5px solid rgba(255,255,255,.35); border-radius:8px;
    transition:background .15s ease, transform .15s ease;
  }
  .back-link:hover{background:rgba(255,255,255,.14); transform:translateX(-2px);}
  .portal-refresh-btn{
    display:inline-flex; align-items:center; justify-content:center; width:34px; padding:0; flex-shrink:0;
  }
  .portal-refresh-btn svg{transition:transform .5s ease;}
  .portal-refresh-btn.portal-refresh-spinning svg{transform:rotate(300deg);}
  .toast-container{position:fixed; top:18px; right:18px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none;}
  .toast{
    display:flex; align-items:center; gap:10px; background:var(--teal-deep); color:#fff; padding:14px 18px;
    border-radius:8px; box-shadow:0 18px 48px rgba(10,78,61,.28); font-size:13.5px; font-weight:600; max-width:360px;
    opacity:0; transform:translateX(20px); transition:opacity .25s ease, transform .25s ease; cursor:pointer; pointer-events:auto;
  }
  .toast-show{opacity:1; transform:translateX(0);}
  .toast-error{background:var(--red);}
  .toast-icon{font-size:15px; flex-shrink:0;}
  .avatar{
    width:32px; height:32px; border-radius:50%; background:#fff; color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;
  }
  .logout-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:6px; padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .logout-btn:hover{background:rgba(255,255,255,.22);}

  /* ===== Layout ===== */
  .layout{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 60px);}
  .sidebar{
    background:var(--surface); border-right:1px solid var(--line); padding:20px 14px;
  }
  .sidebar h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-mute);
    margin:18px 6px 8px;
  }
  .sidebar h4:first-child{margin-top:0;}
  .side-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; border-radius:8px; font-size:13.5px; cursor:pointer; margin-bottom:2px;
    color:var(--ink-soft);
  }
  .side-item.active{background:var(--teal-tint); color:var(--teal-deep); font-weight:600;}
  .side-item:hover:not(.active){background:var(--surface-2);}
  .side-item .count{
    font-family:var(--mono); font-size:11px; color:var(--ink-mute); background:var(--surface-2);
    padding:1px 7px; border-radius:20px;
  }
  .side-item.active .count{background:#fff; color:var(--teal-deep);}

  .main{padding:24px 28px 60px;}

  /* ===== Triage strip ===== */
  .triage{
    display:flex; border-radius:var(--radius); overflow:hidden; height:46px; margin-bottom:22px;
    border:1px solid var(--line);
  }
  .triage-seg{
    display:flex; align-items:center; justify-content:center; gap:8px; color:#fff;
    font-size:12.5px; font-weight:600; letter-spacing:.03em;
  }
  .triage-seg span.n{font-family:var(--mono); font-size:14px;}
  .triage-seg.stat{background:var(--red);}
  .triage-seg.urgent{background:var(--amber);}
  .triage-seg.routine{background:var(--teal);}
  .triage-empty{padding:12px 16px; font-size:12.5px; color:var(--ink-mute);}

  /* ===== Metrics ===== */
  .metrics{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;
  }
  .metric{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .metric .label{font-size:12px; color:var(--ink-mute); margin-bottom:6px;}
  .metric .value{font-size:26px; font-weight:700; font-family:var(--mono);}
  .metric .delta{font-size:11.5px; color:var(--teal); margin-top:4px;}
  .metric .delta.down{color:var(--red);}

  /* ===== Toolbar ===== */
  .toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type=text]{
    flex:1; min-width:220px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:13.5px; background:var(--surface);
  }
  .toolbar select{
    padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--surface);
  }
  .toolbar .count-label{font-size:12.5px; color:var(--ink-mute); margin-left:auto;}

  /* ===== Worklist ===== */
  .board{display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start;}
  table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-mute);
    padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line);
  }
  tbody td{padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.selected{background:var(--teal-tint);}
  .pname{font-weight:600;}
  .puhid{font-family:var(--mono); font-size:11px; color:var(--ink-mute);}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .badge.STAT{background:var(--red-tint); color:var(--red);}
  .badge.Urgent{background:var(--amber-tint); color:var(--amber);}
  .badge.Routine{background:var(--surface-2); color:var(--ink-soft);}
  .status-pill{display:flex; align-items:center; gap:6px; font-size:12.5px;}
  .dot{width:7px; height:7px; border-radius:50%;}
  .dot.pending{background:var(--ink-mute);}
  .dot.in_progress{background:var(--amber);}
  .dot.reported{background:var(--teal);}
  .dot.verified{background:var(--teal-deep);}

  /* ===== Detail panel ===== */
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; position:sticky; top:20px;
  }
  .panel-head{display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .panel-avatar{
    width:42px; height:42px; border-radius:50%; background:var(--teal-tint); color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
  }
  .panel-name{font-weight:700; font-size:15px;}
  .panel-meta{font-size:12px; color:var(--ink-mute); font-family:var(--mono);}

  .viewer{
    background:#0B1614; border-radius:8px; height:190px; position:relative; margin-bottom:8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden; background-size:contain;
    background-position:center; background-repeat:no-repeat;
  }
  .viewer .crosshair{position:absolute; inset:0; opacity:.15; background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/20px 20px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/20px 20px;}
  .viewer .center-icon{color:#4E8577; font-size:12.5px; font-family:var(--mono); text-align:center; z-index:1;}
  .viewer .tag{
    position:absolute; top:8px; left:10px; font-family:var(--mono); font-size:10px; color:#7FB8A6; z-index:2;
  }
  .viewer .tag.br{top:auto; bottom:8px; right:10px; left:auto;}
  .viewer .upload-btn{
    position:absolute; bottom:8px; left:10px; z-index:2; font-size:10.5px; font-family:var(--mono);
    background:rgba(255,255,255,.12); color:#DDEDE8; border:1px solid rgba(255,255,255,.3);
    padding:4px 9px; border-radius:6px; cursor:pointer;
  }
  .viewer .upload-btn:hover{background:rgba(255,255,255,.22);}
  .thumb-strip{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto;}
  .thumb{
    width:44px; height:44px; border-radius:6px; background:#0B1614 center/cover no-repeat; flex:0 0 auto;
    border:2px solid transparent; cursor:pointer; opacity:.7;
  }
  .thumb.active{border-color:var(--teal); opacity:1;}
  .thumb:hover{opacity:1;}
  .wl-controls{display:flex; gap:10px; margin-bottom:14px;}
  .wl-controls .wl-col{flex:1;}
  .wl-controls label{font-size:10.5px; color:var(--ink-mute); display:block; margin-bottom:3px;}
  .wl-controls input[type=range]{width:100%;}

  .info-grid{font-size:12.5px; margin-bottom:14px;}
  .info-row{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--line);}
  .info-row .k{color:var(--ink-mute);}
  .info-row .v{font-weight:600; text-align:right;}

  .field-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-mute); margin:14px 0 6px;}
  select.full, textarea.full{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px;
    font-family:var(--sans); background:var(--surface-2);
  }
  textarea.full{min-height:110px; resize:vertical; line-height:1.5;}
  .template-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .chip{
    font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
    cursor:pointer; color:var(--ink-soft);
  }
  .chip:hover{border-color:var(--teal); color:var(--teal-deep);}

  .panel-actions{display:flex; gap:8px; margin-top:14px;}
  .btn{
    flex:1; padding:9px 0; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  .btn:hover{background:var(--surface-2);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  .btn.primary:hover{background:var(--teal-deep);}
  .btn.critical{background:var(--red); color:#fff; border-color:var(--red);}

  .empty{padding:40px 20px; text-align:center; color:var(--ink-mute); font-size:13px;}
  .panel-error{font-size:12px; color:var(--red); margin-top:8px;}
  .verified-note{font-size:11.5px; color:var(--teal-deep); background:var(--teal-tint); border-radius:8px; padding:8px 10px; margin-top:10px;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    .sidebar{display:flex; overflow-x:auto; gap:6px; padding:12px;}
    .board{grid-template-columns:1fr;}
    .metrics{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">R</div>
    Radiology module
    <span class="sub" id="hospitalNameLabel">Core5 MEDISYS</span>
  </div>
  <div class="topbar-right">
    <a href="dashboard" class="back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <span id="portalUser"></span>
    <div class="avatar" id="portalAvatar"></div>
    <button type="button" class="logout-btn" id="logoutBtn" data-i18n="common.logout">Logout</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <h4 data-i18n="blood_bank.queue">Queue</h4>
    <div class="side-item active" data-scope="all">All studies <span class="count" id="cntAll">0</span></div>
    <div class="side-item" data-scope="mine">Assigned to me <span class="count" id="cntMine">0</span></div>
    <div class="side-item" data-scope="unclaimed">Unassigned <span class="count" id="cntUnassigned">0</span></div>

    <h4>Modality</h4>
    <div id="modalitySideItems"></div>

    <h4 data-i18n="common.status">Status</h4>
    <div class="side-item active" data-status="all"><span data-i18n="blood_bank.all">All</span> <span class="count" id="cntStatusAll">0</span></div>
    <div class="side-item" data-status="pending"><span data-i18n="status.pending">Pending</span> <span class="count" id="cntPending">0</span></div>
    <div class="side-item" data-status="in_progress">In progress <span class="count" id="cntInProgress">0</span></div>
    <div class="side-item" data-status="reported">Reported <span class="count" id="cntReported">0</span></div>
    <div class="side-item" data-status="verified">Verified <span class="count" id="cntVerified">0</span></div>
  </div>

  <div class="main">

    <div class="triage" id="triageStrip"></div>

    <div class="metrics" id="metricsRow"></div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search patient, UHID or accession number">
      <select id="sortSelect">
        <option value="time">Sort: received time</option>
        <option value="priority">Sort: priority</option>
        <option value="name">Sort: patient name</option>
      </select>
      <span class="count-label" id="countLabel"></span>
    </div>

    <div class="board">
      <table>
        <thead>
          <tr>
            <th data-i18n="common.patient">Patient</th>
            <th>Study</th>
            <th data-i18n="blood_bank.priority">Priority</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.doctor">Radiologist</th>
          </tr>
        </thead>
        <tbody id="worklistBody"></tbody>
      </table>

      <div class="panel" id="panel"></div>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="../realtime-client.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../portal-ui.js"></script>
<script src="radiology-queue.js"></script>
</body>
</html>
