<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - OPD Registrations</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="opd_registrations.title">OPD Registrations</h1>
    <p class="portal-subtitle" data-i18n="opd_registrations.subtitle">Today's registered patients and which ABHA lookup method (if any) was used to fetch their details.</p>

    <div class="portal-card" id="registrationsSummary">
      <p class="registrations-summary-line" id="summaryLine">Loading&hellip;</p>
    </div>

    <div class="registrations-filter-row" role="tablist" aria-label="Filter by ABHA verification method">
      <button type="button" class="registrations-filter-chip" data-method="all" aria-selected="true" data-i18n="opd_registrations.filter_all">All</button>
      <button type="button" class="registrations-filter-chip" data-method="manual" data-i18n="opd_registrations.filter_manual">Manual</button>
      <button type="button" class="registrations-filter-chip" data-method="mobile_otp" data-i18n="opd_registrations.filter_mobile_otp">Mobile OTP</button>
      <button type="button" class="registrations-filter-chip" data-method="aadhaar_otp" data-i18n="opd_registrations.filter_aadhaar_otp">Aadhaar OTP</button>
      <button type="button" class="registrations-filter-chip" data-method="fingerprint" data-i18n="opd_registrations.filter_fingerprint">Fingerprint</button>
      <button type="button" class="registrations-filter-chip" data-method="all_three" data-i18n="opd_registrations.filter_all_three">All 3 Methods</button>
    </div>

    <div class="portal-card">
      <table class="portal-table" id="registrationsTable">
        <thead>
          <tr>
            <th data-i18n="common.patient">Patient</th>
            <th data-i18n="patient.uhid">UHID</th>
            <th data-i18n="registration.abha_id">ABHA ID</th>
            <th data-i18n="opd_registrations.method">Method</th>
            <th data-i18n="opd_registrations.registered_at">Registered</th>
          </tr>
        </thead>
        <tbody id="registrationsTableBody"></tbody>
      </table>
      <p class="portal-empty" id="registrationsEmptyState" hidden data-i18n="opd_registrations.no_registrations">No registrations for this filter today.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="opd-registrations.js"></script>
</body>
</html>
