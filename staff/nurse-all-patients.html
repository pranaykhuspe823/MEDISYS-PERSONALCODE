<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - All Patients</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="nurse_pages.all_patients_title">All Patients</h1>
    <p class="portal-subtitle" data-i18n="nurse_pages.all_patients_subtitle">Every currently admitted patient in the hospital, not just your own. Discharge frees their bed immediately.</p>

    <div class="portal-card">
      <table class="portal-table" id="allPatientsTable">
        <thead><tr><th data-i18n="common.patient">Patient</th><th data-i18n="hospital_page.ward">Ward</th><th data-i18n="admin.beds">Bed</th><th data-i18n="ipd_admission.admitting_doctor">Admitting Doctor</th><th data-i18n="hospital_page.nurse">Nurse</th><th data-i18n="nurse_pages.admitted">Admitted</th><th></th></tr></thead>
        <tbody id="allPatientsTableBody"></tbody>
      </table>
      <p class="portal-empty" id="allPatientsEmptyState" data-i18n="nurse_pages.no_patients_admitted" hidden>No patients currently admitted.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="nurse-all-patients.js"></script>
</body>
</html>
