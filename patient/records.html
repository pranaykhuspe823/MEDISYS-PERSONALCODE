<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - My Medical Records</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn" data-i18n="portal.logout">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="records.title">Your Medical Records</h1>
    <p class="portal-subtitle" data-i18n="records.subtitle">Consultations, admissions, vitals, and lab/radiology results &mdash; everything on your chart.</p>

    <div class="portal-card">
      <div class="chart-section">
        <h2 class="chart-section-title" data-i18n="records.consultations">Consultations</h2>
        <div id="consultationsFeed"></div>
      </div>
    </div>

    <div class="portal-card">
      <div class="chart-section">
        <h2 class="chart-section-title" data-i18n="records.lab_radiology_results">Lab &amp; Radiology Results</h2>
        <div id="labFeed"></div>
      </div>
    </div>

    <div class="portal-card">
      <div class="chart-section">
        <h2 class="chart-section-title" data-i18n="records.vitals">Vitals</h2>
        <div id="vitalsFeed"></div>
      </div>
    </div>

    <div class="portal-card">
      <div class="chart-section">
        <h2 class="chart-section-title" data-i18n="records.admissions">Admissions</h2>
        <div id="admissionsFeed"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>PATIENT PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="records.js"></script>
</body>
</html>
