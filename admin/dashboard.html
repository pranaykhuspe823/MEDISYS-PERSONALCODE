<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Superadmin Portal</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <div class="portal-toolbar">
      <div>
        <h1 data-i18n="admin.registered_hospitals">Registered Hospitals</h1>
        <p class="portal-subtitle" data-i18n="admin.dashboard_subtitle">Onboard and manage hospitals running MEDISYS.</p>
      </div>
      <a href="onboard" class="login-btn portal-register-btn" data-i18n="admin.register_hospital">+ Register New Hospital</a>
    </div>

    <div class="portal-card">
      <div id="emptyState" class="portal-empty" hidden>
        <p data-i18n="admin.no_hospitals">No hospitals registered yet.</p>
        <a href="onboard" class="forgot-link" data-i18n="admin.register_first">Register your first hospital &rarr;</a>
      </div>

      <table class="portal-table" id="hospitalTable" hidden>
        <thead>
          <tr>
            <th data-i18n="admin.facility">Facility</th>
            <th data-i18n="admin.city_state">City / State</th>
            <th data-i18n="admin.beds">Beds</th>
            <th data-i18n="admin.client_admin">Client Admin</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="admin.registered_date">Registered</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="hospitalTableBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>SUPERADMIN PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="admin.js"></script>
</body>
</html>
