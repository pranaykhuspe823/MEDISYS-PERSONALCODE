<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Message Staff</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="hospital_page.message_staff_title">Message a Staff Member</h1>
    <p class="portal-subtitle" data-i18n="hospital_page.message_staff_subtitle">Send a private message to any staff member — it appears live in their own portal.</p>

    <div class="portal-card wizard-step">
      <div class="wizard-grid">
        <div>
          <label for="messageStaffSelect" data-i18n="hospital_page.recipient_label">Send to</label>
          <select id="messageStaffSelect"></select>
        </div>
      </div>
      <label for="messageStaffText" style="margin-top:18px;" data-i18n="hospital_page.message_label">Message</label>
      <textarea id="messageStaffText" rows="4" placeholder="Write a private message…" data-i18n-placeholder="hospital_page.message_placeholder"></textarea>
      <p class="form-error" id="messageStaffError" role="alert" aria-live="polite"></p>
      <div class="wizard-nav">
        <button type="button" class="login-btn wizard-next-btn" id="sendStaffMessageBtn" data-i18n="hospital_page.send_message_btn">Send Message</button>
      </div>
      <p class="wizard-hint" id="messageStaffResult"></p>
    </div>

    <h2 class="portal-section-title" data-i18n="hospital_page.recently_sent">Recently Sent</h2>
    <div class="portal-card">
      <div class="portal-table-wrap" style="overflow-x:auto;">
        <table class="portal-table" id="sentMessagesTable">
          <thead>
            <tr>
              <th data-i18n="hospital_page.col_recipient">To</th>
              <th data-i18n="hospital_page.col_message">Message</th>
              <th data-i18n="common.status">Status</th>
              <th data-i18n="common.date">Date</th>
            </tr>
          </thead>
          <tbody id="sentMessagesTableBody"></tbody>
        </table>
      </div>
      <p class="portal-empty" id="sentMessagesEmptyState" hidden data-i18n="hospital_page.no_messages_sent">No messages sent yet.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="hospital.js"></script>
</body>
</html>
