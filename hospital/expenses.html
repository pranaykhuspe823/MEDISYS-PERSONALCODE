<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Expense Log</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard" class="forgot-link portal-back-link" data-i18n="registration.back_to_dashboard">&larr; Back to Dashboard</a>
    <h1 data-i18n="hospital_page.expense_log_title">Expense Log</h1>
    <p class="portal-subtitle" data-i18n="hospital_page.expense_log_subtitle">Track what your hospital spends — this feeds the Net figure on your dashboard.</p>

    <div class="portal-card wizard-step">
      <div class="wizard-grid">
        <div>
          <label for="expenseCategory" data-i18n="hospital_page.expense_category_label">Category</label>
          <input type="text" id="expenseCategory" placeholder="e.g. Salaries, Utilities, Equipment" data-i18n-placeholder="hospital_page.expense_category_placeholder" />
        </div>
        <div>
          <label for="expenseAmount" data-i18n="hospital_page.expense_amount_label">Amount (₹)</label>
          <input type="number" id="expenseAmount" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label for="expenseDate" data-i18n="hospital_page.expense_date_label">Date</label>
          <input type="date" id="expenseDate" />
        </div>
      </div>
      <label for="expenseNote" data-i18n="hospital_page.expense_note_label">Note (optional)</label>
      <input type="text" id="expenseNote" placeholder="e.g. March payroll" data-i18n-placeholder="hospital_page.expense_note_placeholder" />
      <p class="form-error" id="expenseError" role="alert" aria-live="polite"></p>
      <div class="wizard-nav">
        <button type="button" class="login-btn wizard-next-btn" id="addExpenseBtn" data-i18n="hospital_page.add_expense_btn">Add Expense</button>
      </div>
    </div>

    <h2 class="portal-section-title" data-i18n="hospital_page.recent_expenses">Recent Expenses</h2>
    <div class="portal-card">
      <div class="portal-table-wrap" style="overflow-x:auto;">
        <table class="portal-table" id="expensesTable">
          <thead>
            <tr>
              <th data-i18n="hospital_page.expense_category_label">Category</th>
              <th data-i18n="hospital_page.expense_amount_label">Amount</th>
              <th data-i18n="hospital_page.expense_note_label">Note</th>
              <th data-i18n="common.date">Date</th>
              <th data-i18n="common.actions">Actions</th>
            </tr>
          </thead>
          <tbody id="expensesTableBody"></tbody>
        </table>
      </div>
      <p class="portal-empty" id="expensesEmptyState" hidden data-i18n="hospital_page.no_expenses">No expenses logged yet.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="hospital.js"></script>
</body>
</html>
